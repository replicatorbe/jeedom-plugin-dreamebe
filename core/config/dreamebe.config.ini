; La section doit porter l'identifiant du plugin : nommée [default], elle serait
; entièrement inerte et chaque config::byKey retomberait sur son défaut codé.
[dreamebe]
region = eu
; Secondes entre deux lectures de l'état d'un robot. Le cycle est ramené à une
; minute pendant un nettoyage, pour que la progression avance sous les yeux.
polling_interval = 120
; Entretien et statistiques : ces chiffres bougent d'un point par semaine, les
; relire à chaque cycle ne ferait que du trafic.
slow_interval = 1800
map_enable = 1
map_interval = 900
history_enable = 1
connect_timeout = 5
timeout = 15
